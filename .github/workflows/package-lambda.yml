name: Package Clean Air Lambda

on:
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Lambda dependencies
        run: |
          python -m pip install -r backend/requirements-lambda.txt --target package

      - name: Package backend
        run: |
          mkdir -p package/backend
          cp backend/main.py backend/lambda_handler.py package/backend/
          cd package
          zip -qr ../lambda.zip .

      - name: Upload Lambda ZIP
        uses: actions/upload-artifact@v4
        with:
          name: clean-air-lambda
          path: lambda.zip
          if-no-files-found: error
